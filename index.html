<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>愛的家の小遊戲</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="lobby" class="screen screen-active">
      <button id="bagButton" class="bag-button" type="button">
        <img src="outputs/包包圖.png" alt="包包">
      </button>
      <button id="blacksmithButton" class="blacksmith-button" type="button">
        <img src="outputs/鐵匠鋪圖.png" alt="鐵匠鋪">
      </button>
      <div class="money-display">
        <img class="money-icon" src="outputs/錢.png" alt="錢">
        <span id="moneyText">0</span>
      </div>
      <button id="volumeToggleBtn" class="volume-toggle-button" type="button">音量</button>
      <div id="volumeControls" class="volume-controls">
        <label>
          背景音樂
          <input id="bgVolumeInput" type="range" min="0" max="100" value="65">
          <button id="bgSoundToggleBtn" class="mobile-sound-toggle" type="button"></button>
        </label>
        <label>
          特效音樂
          <input id="sfxVolumeInput" type="range" min="0" max="100" value="85">
          <button id="sfxSoundToggleBtn" class="mobile-sound-toggle" type="button"></button>
        </label>
      </div>
      <h1>愛的家の小遊戲</h1>
      <div class="lobby-hero-wrap">
        <img id="equippedWeapon" class="lobby-equipment equip-weapon" src="outputs/空武器圖.png" alt="空武器">
        <span id="equippedWeaponLevel" class="lobby-equipment-level equip-weapon-level"></span>
        <img id="equippedArmor" class="lobby-equipment equip-armor" src="outputs/空護甲圖.png" alt="空護甲">
        <span id="equippedArmorLevel" class="lobby-equipment-level equip-armor-level"></span>
        <img id="equippedShoes" class="lobby-equipment equip-shoes" src="outputs/空靴子圖.png" alt="空鞋子">
        <span id="equippedShoesLevel" class="lobby-equipment-level equip-shoes-level"></span>
        <img id="equippedAccessory" class="lobby-equipment equip-accessory" src="outputs/空飾品圖.png" alt="空飾品">
        <span id="equippedAccessoryLevel" class="lobby-equipment-level equip-accessory-level"></span>
        <button id="heroInfoBtn" class="hero-info-button" type="button">
          <img class="lobby-hero" src="outputs/愛的家.png?v=2" alt="愛的家">
        </button>
      </div>
      <button id="difficultyInfo" class="difficulty-info" type="button">
        <span id="difficultyText">難度：普通</span>
        <span id="bossCountText">BOSS：1 隻</span>
        <span id="multiplierText">倍率：1.0x</span>
        <span id="rewardText">會獲得的東西：金錢100</span>
      </button>
      <div class="game-version">版本 1.07</div>
      <button id="startBtn" class="primary-button" type="button">開始</button>
      <div class="death-warning-text">死亡會掉落身上全部裝備</div>

      <div id="difficultyModal" class="settings-modal">
        <div class="settings-box">
          <h2>設定</h2>

          <label>
            難度
            <select id="difficultySelect">
              <option value="簡單" selected>簡單</option>
              <option value="普通" disabled>普通（未開放）</option>
              <option value="困難" disabled>困難（未開放）</option>
            </select>
          </label>

          <label>
            BOSS 數量
            <input id="bossCountInput" type="number" min="1" max="8" value="1">
          </label>

          <label>
            倍率
            <input id="multiplierInput" type="number" min="1" step="0.5" value="1.0">
          </label>

          <button id="closeDifficultyBtn" class="small-button" type="button">完成</button>
        </div>
      </div>

      <div id="heroInfoModal" class="settings-modal">
        <div class="settings-box">
          <h2>角色資訊</h2>
          <div id="heroStatsList" class="hero-stats-list"></div>
          <button id="closeHeroInfoBtn" class="small-button" type="button">關閉</button>
        </div>
      </div>

      <div id="inventoryModal" class="settings-modal">
        <div class="settings-box inventory-box">
          <h2>包包</h2>
          <div id="inventoryList" class="inventory-list"></div>
          <button id="closeInventoryBtn" class="small-button" type="button">關閉</button>
        </div>
      </div>

      <div id="itemModal" class="settings-modal">
        <div class="settings-box item-box">
          <img id="itemModalImage" class="item-modal-image" src="outputs/空武器圖.png" alt="">
          <h2 id="itemModalName">裝備</h2>
          <div id="itemModalInfo" class="item-modal-info"></div>
          <button id="itemModalActionBtn" class="small-button" type="button">穿上</button>
          <button id="closeItemModalBtn" class="small-button" type="button">關閉</button>
        </div>
      </div>

      <div id="saveEditorModal" class="settings-modal">
        <div class="settings-box save-editor-box">
          <h2>存檔編輯</h2>
          <label>
            金錢
            <input id="saveMoneyInput" type="number" min="0" value="0">
          </label>
          <textarea id="saveJsonInput" class="save-json-input" spellcheck="false"></textarea>
          <button id="applySaveEditorBtn" class="small-button" type="button">套用</button>
          <button id="closeSaveEditorBtn" class="small-button" type="button">關閉</button>
        </div>
      </div>
    </section>

    <section id="blacksmith" class="screen">
      <div class="blacksmith-screen">
        <div id="blacksmithModeSelect" class="blacksmith-mode-select">
          <button id="openUpgradeModeBtn" class="primary-button" type="button">升級</button>
          <button id="openComposeModeBtn" class="primary-button" type="button">合成</button>
        </div>

        <div id="blacksmithComposePanel" class="blacksmith-panel">
          <div class="blacksmith-title">
            <div>合成鐵匠鋪</div>
            <span>三個「同部位 + 同稀有度」可合成</span>
            <span class="blacksmith-success-text">成功將獲得提升稀有度同部位之隨機物品</span>
            <span class="blacksmith-fail-text">失敗將獲得同稀有度同部位之隨機物品</span>
            <span class="blacksmith-cost-text">#每次合成花費500塊</span>
            <span class="blacksmith-cost-text">#不論成功或失敗新武器等級將會歸零</span>
          </div>
          <img id="blacksmithInsideImage" class="blacksmith-inside" src="outputs/鐵匠鋪內部圖.png" alt="鐵匠鋪內部">
          <button id="blacksmithResultSlot" class="forge-slot forge-result-slot" type="button">
            <img id="blacksmithResultImage" src="outputs/空裝備格子圖.png" alt="合成結果">
          </button>
          <img class="forge-arrow" src="outputs/鐵匠鋪箭頭圖.png" alt="合成箭頭">
          <div class="forge-input-slots">
            <button class="forge-slot" data-slot="0" type="button"><img src="outputs/空裝備格子圖.png" alt="材料1"></button>
            <button class="forge-slot" data-slot="1" type="button"><img src="outputs/空裝備格子圖.png" alt="材料2"></button>
            <button class="forge-slot" data-slot="2" type="button"><img src="outputs/空裝備格子圖.png" alt="材料3"></button>
          </div>
          <button id="synthesizeBtn" class="primary-button" type="button">合成</button>
          <div id="blacksmithResult" class="blacksmith-result"></div>
          <button id="blacksmithBackBtn" class="small-button" type="button">回大廳</button>
        </div>

        <div id="blacksmithUpgradePanel" class="blacksmith-panel">
          <div class="blacksmith-title">
            <div>升級鐵匠鋪</div>
          </div>
          <div id="upgradeMoneyText" class="blacksmith-money-text">目前金錢：0</div>
          <img id="upgradeBlacksmithInsideImage" class="blacksmith-inside" src="outputs/鐵匠鋪內部圖.png" alt="鐵匠鋪內部">
          <div class="upgrade-slots">
            <button id="upgradeInputSlot" class="forge-slot" type="button">
              <img id="upgradeInputImage" src="outputs/空裝備格子圖.png" alt="升級材料">
            </button>
            <div class="upgrade-detail-wrap">
              <div id="upgradeDetailText" class="upgrade-detail-text">選擇裝備後顯示升級詳細狀態</div>
              <img class="upgrade-arrow" src="outputs/升級箭頭圖.png" alt="升級箭頭">
            </div>
            <button id="upgradeResultSlot" class="forge-slot" type="button">
              <img id="upgradeResultImage" src="outputs/空裝備格子圖.png" alt="升級結果">
            </button>
          </div>
          <button id="upgradeBtn" class="primary-button" type="button">升級<br>花費:</button>
          <div id="upgradeResultText" class="blacksmith-result"></div>
          <button id="upgradeBackBtn" class="small-button" type="button">回大廳</button>
        </div>

        <div id="forgePickerModal" class="settings-modal">
          <div class="settings-box inventory-box">
            <h2>選擇裝備</h2>
            <div id="forgePickerList" class="inventory-list"></div>
            <button id="closeForgePickerBtn" class="small-button" type="button">關閉</button>
          </div>
        </div>
      </div>
    </section>

    <section id="game" class="screen">
      <div class="battle-layout">
        <div id="bossHpText" class="boss-hp-text">
          <div>HP:100/100</div>
        </div>
        <div id="damageText" class="damage-text"></div>
        <div id="bubbleDebugText" class="bubble-debug-text"></div>
        <div id="bagDropText" class="bag-drop-text">獲得袋子</div>
        <img id="enemy" class="enemy" src="outputs/小豬.png" alt="小豬">

        <div class="arena" aria-label="戰鬥場地">
          <div class="lane" data-lane="0">左</div>
          <div class="lane" data-lane="1">中</div>
          <div class="lane" data-lane="2">右</div>
          <div class="lane" data-lane="3"></div>
          <div class="lane" data-lane="4"></div>
          <div class="lane" data-lane="5"></div>
          <div class="lane" data-lane="6"></div>
          <div class="lane" data-lane="7"></div>
          <div class="lane" data-lane="8"></div>
          <div id="bossIntro" class="boss-intro"></div>
          <img id="gageAttack" class="gage-attack" src="outputs/格格攻擊圖1.png" alt="格格攻擊">
          <img id="bullet" class="bullet" src="outputs/小豬的子彈.png" alt="小豬的子彈">
          <img id="bubbleWeapon" class="bubble-weapon" src="outputs/泡泡武器圖.png" alt="泡泡武器">
          <img id="playerBullet" class="player-bullet" src="outputs/玩家子彈.png" alt="玩家子彈">
          <img id="hero" class="hero" src="outputs/愛的家.png?v=2" alt="愛的家">
        </div>

        <div class="battle-footer">
          <button id="backBtn" class="small-button" type="button">回大廳</button>
          <div class="battle-armor">
            <img src="outputs/護甲值圖.png" alt="護甲">
            <span id="battleArmorText">+0%護甲</span>
          </div>
        </div>

        <div id="result" class="result-modal">
          <div class="result-box">
            <h2 id="resultTitle">失敗</h2>
            <div id="resultMoneyText" class="result-money-text">獲得金錢：0</div>
            <div id="deathDropText" class="death-drop-text"></div>
            <div id="resultBagText" class="result-bag-text">獲得袋子：0</div>
            <div id="resultBagList" class="result-bag-list"></div>
            <button id="resultBackBtn" class="small-button" type="button">回大廳</button>
          </div>
        </div>

        <div id="koEffect" class="ko-effect">
          <img id="koK" class="ko-letter" src="outputs/K.png" alt="K">
          <img id="koO" class="ko-letter" src="outputs/O.png" alt="O">
        </div>
      </div>
    </section>

    <section id="bagOpening" class="screen">
      <div class="bag-opening-screen">
        <button id="openBagBtn" class="open-bag-button" type="button">
          <img id="openBagImage" src="outputs/普通袋子.png" alt="普通袋子">
        </button>
        <div id="openBagReward" class="open-bag-reward"></div>
        <div id="openBagRarity" class="open-bag-rarity"></div>
        <div id="openBagProgress" class="open-bag-progress">袋子 1/1　點擊 0/4</div>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
